[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zhangxiew-chunksem"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出切块边界的语义完整性上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "zhangxiew" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://zhangxiew.github.io"
Repository = "https://github.com/zhangxiew/chunksem"
Issues = "https://github.com/zhangxiew/chunksem/issues"

[project.scripts]
chunksem = "chunksem:main"

[tool.setuptools]
py-modules = ["chunksem"]
